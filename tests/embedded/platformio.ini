[platformio]
boards_dir = ../../boards
[env:s3]
platform = espressif32@6.13.0
board = seeed_xiao_esp32s3
framework = arduino
lib_deps = KaruraCAN=symlink://../..
[env:pico]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git#79ce473e1a8010ed8096388690222fd2c94858a6
board = rpipico
board_build.core = earlephilhower
framework = arduino
lib_deps = KaruraCAN=symlink://../..

[env:pico2]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git#79ce473e1a8010ed8096388690222fd2c94858a6
board = rpipico2
board_build.core = earlephilhower
framework = arduino
lib_deps = KaruraCAN=symlink://../..
[env:xiao_rp2350]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git#79ce473e1a8010ed8096388690222fd2c94858a6
board = seeed_xiao_rp2350
board_build.core = earlephilhower
framework = arduino
lib_deps = KaruraCAN=symlink://../..
[env:c5]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.37/platform-espressif32.zip
board = seeed-xiao-esp32-c5
framework = arduino
lib_deps = KaruraCAN=symlink://../..

[env:s3_mcp2515]
extends = env:s3
build_flags = -DTEST_MCP2515
[env:s3_mcp2518]
extends = env:s3
build_flags = -DTEST_MCP2518
[env:pico_mcp2518]
extends = env:pico
build_flags = -DTEST_MCP2518
[env:pico2_mcp2518]
extends = env:pico2
build_flags = -DTEST_MCP2518
[env:xiao_rp2350_mcp2518]
extends = env:xiao_rp2350
build_flags = -DTEST_MCP2518
[env:c5_mcp2515]
extends = env:c5
build_flags = -DTEST_MCP2515
[env:c5_mcp2518]
extends = env:c5
build_flags = -DTEST_MCP2518
